<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Title of the poem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Hanken+Grotesk:wght@400;500&family=DM+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6ebe3; --side: #efc9c9; --ink: #3b1e2b; --muted: #7d5a65;
    --rule: rgba(59, 30, 43, 0.18); --accent: #c2255c;
    --display: "Instrument Serif", Georgia, serif;
    --body: "Hanken Grotesk", system-ui, sans-serif;
    --mono: "DM Mono", ui-monospace, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1f1318; --side: #2c1a22; --ink: #f6dedb; --muted: #b997a0;
      --rule: rgba(246, 222, 219, 0.2); --accent: #ff8fb3;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 18px; line-height: 1.6; }
  a { color: inherit; text-decoration: none; }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .wrap { max-width: 620px; margin: 0 auto; padding: 48px 20px 72px; display: flex; flex-direction: column; gap: 40px; }
  .back { font-family: var(--mono); font-size: 13px; color: var(--muted); width: fit-content; border-bottom: 1px solid var(--rule); transition: color .15s, border-color .15s; }
  .back:hover { color: var(--accent); border-color: var(--accent); }

  h1 { margin: 0; font-family: var(--display); font-style: italic; font-weight: 400; font-size: clamp(44px, 9vw, 72px); line-height: 1; letter-spacing: -0.02em; text-wrap: balance; }
  .byline { margin: 8px 0 0; font-family: var(--mono); font-size: 12px; color: var(--muted); }

  /* Line breaks in the poem are kept exactly as you type them. */
  .poem { margin: 0; font-family: var(--display); font-size: 26px; line-height: 1.45; white-space: pre-line; }
  .stanza { margin: 0 0 1.6em; }

  .dots { font-family: var(--mono); letter-spacing: 0.5em; color: var(--accent); font-size: 12px; margin: 0; }
</style>
</head>
<body>
<main class="wrap">

  <a class="back" href="index.html">← back to jane</a>

  <header>
    <h1>Title of the poem</h1>
    <p class="byline">jane · 2026</p>
  </header>

  <article class="poem">
    <p class="stanza">First line of the first stanza
second line of the first stanza
third line of the first stanza</p>

    <p class="stanza">First line of the second stanza
second line of the second stanza
third line of the second stanza</p>
  </article>

  <p class="dots" aria-hidden="true">●●●</p>

</main>
</body>
</html>
